<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>✨ Секретная страница</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="effects.css">
<style>
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:24px}
  .sec-card{max-width:600px;width:100%;background:linear-gradient(165deg,rgba(255,235,225,.65),rgba(245,215,205,.35));border-radius:24px;padding:32px 28px;box-shadow:0 4px 24px rgba(160,100,80,.08);text-align:center}
  .sec-card p{font-family:'Nunito',sans-serif;font-size:18px;line-height:1.7;color:#4a2a2a;margin:12px 0}
  .sec-card .heart{font-size:48px;margin-bottom:8px}
</style>
</head>
<body class="dark">

<div class="stars-container" id="starsContainer"></div>

<div class="sec-card">
  <div class="heart">💖</div>
  <p>Катя, ты — самое тёплое и светлое, что есть в этом мире.</p>
  <p>Пусть каждый твой день начинается с улыбки, а сердце всегда чувствует себя любимым.</p>
  <p>Ты заслуживаешь всего самого лучшего.</p>
  <p style="font-size:22px;font-weight:700;color:#8b1a2b;margin-top:20px">Я тебя очень люблю! ❤️</p>
</div>

<button class="btn" onclick="history.back()" style="margin-top:4px">← Назад</button>

<div class="page-transition active" id="pageTransition"></div>
<script src="confetti.js"></script>
<script src="effects.js"></script>
<script src="widgets.js"></script>
</body>
</html>
