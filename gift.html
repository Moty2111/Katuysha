<!-- ===== GIFT BOX ===== -->
<div id="giftBox">
<div class="gb-wrap">
<div class="gb" id="gb">

    <div class="gb-body-shine"></div>

<!-- ===== MUSIC BOX ===== -->
<div id="musicBox">
<div class="mb-ctrl" id="mbCtrl">
  <div class="mb-ctrl-header">
    <span class="mb-ctrl-title">🎵 Музыкальная шкатулка</span>
    <button class="mb-ctrl-close" id="mbCtrlClose">✕</button>
  </div>
  <div class="mb-ctrl-row">
    <button class="mb-btn" id="mbPlayBtn">▶</button>
    <div class="mb-progress" id="mbProg"><div class="mb-progress-f" id="mbProgF"></div></div>
    <span class="mb-time" id="mbTime">0:00</span>
  </div>
  <div class="mb-vol-wrap">
    <span class="mb-vol-icon">🔊</span>
    <input type="range" class="mb-vol-slider" id="mbVol" min="0" max="1" step="0.05" value="0.5">
  </div>
</div>
<div class="mb-box" id="mbBox">
  <div class="mb-box-inner">
  <div class="mb-body">
    <div class="mb-body-trim"></div>
    <div class="mb-body-trim-b"></div>
    <div class="mb-body-inlay"></div>
    <div class="mb-body-ornament"></div>
    <div class="mb-body-ornament-r"></div>
    <div class="mb-body-staff">
      <div class="mb-staff-line"></div>
      <div class="mb-staff-line"></div>
      <div class="mb-staff-line"></div>
      <div class="mb-staff-note">♪</div>
      <div class="mb-staff-note">♫</div>
    </div>
    <div class="mb-body-shine"></div>
    <div class="mb-body-glow"></div>
    <div class="mb-cylinder">
      <div class="mb-cyl-inner"></div>
      <div class="mb-cyl-pin"></div><div class="mb-cyl-pin"></div><div class="mb-cyl-pin"></div>
      <div class="mb-cyl-pin"></div><div class="mb-cyl-pin"></div><div class="mb-cyl-pin"></div>
      <div class="mb-cyl-pin"></div><div class="mb-cyl-pin"></div>
    </div>
    <div class="mb-comb">
      <div class="mb-comb-tooth"></div><div class="mb-comb-tooth"></div><div class="mb-comb-tooth"></div>
      <div class="mb-comb-tooth"></div><div class="mb-comb-tooth"></div><div class="mb-comb-tooth"></div>
      <div class="mb-comb-tooth"></div><div class="mb-comb-tooth"></div>
    </div>
  </div>
  <div class="mb-lid" id="mbLid">
    <div class="mb-lid-trim"></div>
    <div class="mb-lid-inlay"></div>
    <div class="mb-lid-ornament"></div>
    <div class="mb-lid-ornament-c"></div>
    <div class="mb-lid-shine"></div>
    <div class="mb-lid-glint"></div>
  </div>
  <div class="mb-key"><div class="mb-key-stem"></div><div class="mb-key-h"></div></div>
  <div class="mb-stage"></div>
  <div class="mb-vinyl" id="mbVinyl">
    <div class="mb-vinyl-disc">
      <div class="mb-vinyl-grooves"></div>
      <div class="mb-vinyl-glow"></div>
      <div class="mb-vinyl-label">
        <div class="mb-vinyl-label-inner"></div>
        <div class="mb-vinyl-label-ring"></div>
        <div class="mb-vinyl-hole"></div>
        <div class="mb-vinyl-text">К</div>
        <div class="mb-vinyl-text-s">♫</div>
      </div>
      <div class="mb-vinyl-shine"></div>
      <div class="mb-vinyl-shine2"></div>
      <div class="mb-vinyl-edge"></div>
    </div>
    <div class="mb-tonearm">
      <div class="mb-tonearm-base"></div>
      <div class="mb-tonearm-arm-lower"></div>
      <div class="mb-tonearm-pivot"></div>
      <div class="mb-tonearm-arm-upper">
        <div class="mb-tonearm-headshell"></div>
        <div class="mb-tonearm-needle"></div>
      </div>
    </div>
  </div>
  <div class="mb-mirror"></div>
  <div class="mb-pedestal"></div>
  <div class="mb-notes" id="mbNotes"></div>
  </div>
</div>
</div>

<div class="page-transition active" id="pageTransition"></div>
